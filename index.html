<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revisor de Código con IA</title>
    <meta name="description" content="Evalúa código de estudiantes contra una rúbrica con IA: puntaje por criterio, retroalimentación y nota en escala chilena. Demo pública sin clave." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Code Reviewer — rubric-based grading of student code" />
    <meta property="og:description" content="Open-source web app that grades student code against a rubric with Google Gemini. The public demo shows a full sample report, no API key needed." />
    <meta property="og:url" content="https://giocrisrai.github.io/teaching_assistant_in_code_review/" />
    <meta property="og:image" content="https://giocrisrai.github.io/teaching_assistant_in_code_review/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script type="module" src="/index.tsx" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #030712; /* Corresponds to bg-gray-950 */
        font-family: 'Inter', sans-serif;
        background-image: radial-gradient(circle at 20% 20%, rgba(14, 165, 233, 0.08), transparent 35%),
                          radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.08), transparent 35%);
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* Tailwind Typography dibuja comillas invertidas alrededor del codigo en linea:
         se quitan y el codigo se muestra como una etiqueta. */
      .prose code::before, .prose code::after { content: none; }
      .prose :not(pre) > code {
        background: rgba(148, 163, 184, 0.16);
        border-radius: 4px;
        padding: 0.1em 0.35em;
        font-weight: 500;
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.5s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
